name: My Pen | Build Windows installer V10.0

# Build on demand. Also build when a V10.0 tag is pushed.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v10.0*'

permissions:
  contents: read

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python 3.12 x64
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt "pyinstaller>=6.11,<7" pillow
      - name: Build and smoke-test installer
        run: python scripts/build_windows.py
      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: MyPen-Setup-10.0-x64
          path: installer-output/MyPen-Setup-10.0-x64.exe
          if-no-files-found: error
      - name: Upload portable application folder
        uses: actions/upload-artifact@v7
        with:
          name: MyPen-Portable-10.0-x64
          path: dist/My Pen/
          if-no-files-found: error
